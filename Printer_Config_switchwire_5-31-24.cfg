[include mainsail.cfg]
# This file contains common pin mappings for the BigTreeTech SKR PRO.
# To use this config, the firmware should be compiled for the
# STM32F407 with a "32KiB bootloader".

# The "make flash" command does not work on the SKR PRO. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR PRO
# with that SD card.

# See docs/Config_Reference.md for a description of parameters.
[printer]
kinematics: corexz
max_velocity: 500
max_accel: 3500
max_accel_to_decel: 3000
max_z_velocity: 500
max_z_accel: 3500
square_corner_velocity: 3.0

[input_shaper]
shaper_freq_x: 42.04  # frequency for the X mark of the test model
shaper_freq_y: 26.43  # frequency for the Y mark of the test model
shaper_type: mzv

[stepper_x]
step_pin: PE9
dir_pin: PF1
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
#endstop_pin: PB10
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 218
position_min: 0
position_max: 218
homing_speed: 20
homing_positive_dir: True
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC13
run_current: 1.1        # may need changing
hold_current: .6       # may need changing
interpolate: False
stealthchop_threshold: 99999
# SENSORLESS HOMING
driver_SGTHRS: 45
diag_pin: ^PB10

[stepper_y]
step_pin: PE11
dir_pin: PE8
enable_pin: !PD7
microsteps: 16
rotation_distance: 40.666
#endstop_pin: PE12
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 233
position_max: 233
position_min: 0
homing_speed: 70
homing_positive_dir: True
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PE3
run_current: 1.1
hold_current: 0.6       
stealthchop_threshold: 0
interpolate: True
# SENSORLESS HOMING
diag_pin: ^PE12
driver_SGTHRS: 135

[stepper_z]
step_pin: PE13
dir_pin: PC2
enable_pin: !PC0
microsteps: 16
rotation_distance: 40
#endstop_pin: PG8
endstop_pin: probe:z_virtual_endstop
position_max: 225
position_min: -5
homing_speed: 25

[tmc2209 stepper_z]
uart_pin: PE1
run_current: 1.1
hold_current: .6
interpolate: False
stealthchop_threshold: 0

[extruder]
step_pin: PE14
dir_pin: PA0
enable_pin: !PC3
# BMG with 3:1 ratio and 1.8 stepper
microsteps: 32
rotation_distance: 13.558
full_steps_per_rotation: 200
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.025
pressure_advance_smooth_time: 0.040
heater_pin: PB1 # Heater0
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF3 # T0
#control: pid
min_extrude_temp: 180
min_temp: 0
max_temp: 320
# bambulab knockoff
#pid_Kp=30.874
#pid_Ki=2.018
#pid_Kd=118.092

[tmc2209 extruder]
uart_pin: PD4
run_current: 0.540
hold_current: 0.430
interpolate: False

[bltouch]
sensor_pin: ^PA2
control_pin: PA1
x_offset: 0.0
y_offset: 23
#z_offset: 0.0
samples: 1
speed: 4

[heater_bed]
heater_pin: PD12 #Heater bed
sensor_pin: PF4 # T1
sensor_type: ATC Semitec 104GT-2
#control: pid
#pid_Kp=30.874
#pid_Ki=2.018
#pid_Kd=118.092
min_temp: 0
max_temp: 120

[fan]
pin: PC8

[heater_fan fan1]
pin: PE5

[homing_override]
axes: z
set_position_z: 0
gcode:
    G90
    G0 Z5 F500
    G28 X0 Y0
    G0 X115 Y100 F9000
    G28 Z0
    G0 Z5 F500

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 25,30.0
mesh_max: 210,220
probe_count: 7,7
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[bed_screws]
screw1: 42, 55
#screw1_name: Front Left
screw2: 191, 55
#screw2_name: Front Right
screw3: 191, 178
#screw3_name: Back Right
screw4: 42, 178
#screw4_name: Back Left



[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_260026001051313131353237-if00

[gcode_macro PRINT_START]
gcode:
  #Grab variables from the slicer
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  #Start Bed Heating
  M140 S{BED_TEMP}
  #Use absolue coordinates
  G90
  # Home the Printer
  G28 X
  G28 Y
  G28 Z
  #Reset Extruder
  G92 E0
  BED_MESH_CALIBRATE PROFILE=mesh1 METHOD=automatic
  #move to wait position
  G1 X0 Y0 Z10 F4000.0
  #Heat up hot end
  M109 S{EXTRUDER_TEMP}
  M190 S{BED_TEMP}
  #Purge Line
  G1 X1 Y1 Z.4 F5000
  G1 X125 Y1 Z.4 E16 F3000
  G92 E0
  G1 Z5 F3000


