# Klicky Probe Variables - Voron Trident 300mm
# Customize these values to match your exact dock position.
# See: https://github.com/jlas1/Klicky-Probe for documentation.

[gcode_macro _User_Variables]
variable_verbose:             True    # Enable verbose output
variable_debug:              False    # Enable Debug output
variable_travel_speed:         200    # travel move speed (mm/s)
variable_move_accel:          1000    # travel move acceleration
variable_dock_speed:            50    # dock approach speed
variable_release_speed:        120    # release from magnets speed
variable_z_drop_speed:          30    # z lower speed

variable_safe_z:                25    # Minimum Z for attach/dock and homing

variable_enable_z_hop:        True    # hop Z before moves when Z not homed

variable_max_bed_y:            295    # Max bed Y (matches your position_max)
variable_max_bed_x:            295    # Max bed X (matches your position_max)

# Z endstop: set to 0 since you use probe:z_virtual_endstop
variable_z_endstop_x:            0
variable_z_endstop_y:            0

# Dock location — stow position is 263X, 295Y (right-rear, gantry-mounted)
variable_docklocation_x:       263    # X dock position
variable_docklocation_y:       295    # Y dock position (back of printer)
variable_docklocation_z:      -128    # Z dock position (-128 = gantry/frame mount)

# Servo dock (not used)
variable_enable_dock_servo:  False
variable_servo_name:        'NAME'
variable_servo_deploy:          10
variable_servo_retract:         11
variable_servo_delay:          250

# Dock move — relative move to release probe after docking (slide left away from dock)
Variable_dockmove_x:           -40
Variable_dockmove_y:             0
Variable_dockmove_z:             0

# Attach move — relative move to pick up probe (pull forward away from dock)
Variable_attachmove_x:           0
Variable_attachmove_y:          30
Variable_attachmove_z:           0

# Umbilical (not used)
variable_umbilical:          False
variable_umbilical_x:           15
variable_umbilical_y:           15

# Parking
variable_park_toolhead:      False
variable_parkposition_x:       150
variable_parkposition_y:       150
variable_parkposition_z:        30

variable_version:                1

# Intermediate attach move (not needed for most setups)
Variable_attachmove2_x:          0
Variable_attachmove2_y:          0
Variable_attachmove2_z:          0

variable_home_backoff_x:        10    # mm to back off after homing X
variable_home_backoff_y:        10    # mm to back off after homing Y

variable_override_homing:       ''    # '' = default klicky behavior
variable_dock_on_zhome:       True    # dock probe after Z home if not needed

variable_bypass_probe_docking:        False

# Do not modify below
gcode:
    {% set Mx = printer['configfile'].config["stepper_x"]["position_max"]|float %}
    {% set My = printer['configfile'].config["stepper_y"]["position_max"]|float %}
    {% set Ox = printer['configfile'].config["probe"]["x_offset"]|float %}
    {% set Oy = printer['configfile'].config["probe"]["y_offset"]|float %}
    {% set Oz = printer['configfile'].config["probe"]["z_offset"]|float %}

    {% if z_endstop_x != 0 or z_endstop_y != 0 %}
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=z_endstop_x VALUE={ z_endstop_x }
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=z_endstop_y VALUE={ z_endstop_y }
    {% else %}
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=z_endstop_x VALUE={ (Mx * 0.5) - Ox }
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=z_endstop_y VALUE={ (My * 0.5) - Oy }
    {% endif %}
