# Klicky-specific overrides for Knomi status integration
# These macros are called by klicky-macros.cfg at the appropriate times.
# They bridge Klicky probe actions with Knomi/Stealthburner LED status.

[gcode_macro _KLICKY_STATUS_HOMING]
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    STATUS_HOMING

[gcode_macro _KLICKY_STATUS_LEVELING]
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
    STATUS_LEVELING

[gcode_macro _KLICKY_STATUS_MESHING]
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
    STATUS_CALIBRATING_Z

[gcode_macro _KLICKY_STATUS_READY]
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
    STATUS_READY

[gcode_macro _KLICKY_STATUS_BUSY]
gcode:
    STATUS_BUSY

[gcode_macro _KLICKY_STATUS_CLEANING]
gcode:
    STATUS_CLEANING

[gcode_macro _KLICKY_STATUS_CALIBRATING_Z]
gcode:
    STATUS_CALIBRATING_Z
